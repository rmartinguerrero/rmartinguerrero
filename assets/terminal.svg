  <circle cx="66" cy="604" r="3.5" fill="#66ff99" opacity="0.85" filter="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.45;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="608" font-family="'Courier New',Courier,monospace" font-size="7" fill="#333" letter-spacing="1">PWR</text>
</svg>
