<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="1200" height="4">
      <rect width="1200" height="2" fill="transparent"/>
      <rect y="2" width="1200" height="2" fill="#000" opacity="0.1"/>
    </pattern>
    <radialGradient id="curvature" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66ff99" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="screen-clip">
      <rect x="50" y="40" width="1100" height="550" rx="10"/>
    </clipPath>
    <linearGradient id="bezel-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- ===== MONITOR BEZEL ===== -->
  <rect width="1200" height="630" rx="22" fill="#1a1a1a"/>
  <rect x="2" y="2" width="1196" height="626" rx="20" fill="#151515"/>
  <rect x="7" y="7" width="1186" height="616" rx="18" fill="url(#bezel-edge)"/>
  <rect x="38" y="28" width="1124" height="574" rx="14" fill="#0a0a0a"/>
  <rect x="42" y="32" width="1116" height="566" rx="12" fill="#070707"/>

  <!-- ===== SCREEN ===== -->
  <rect x="50" y="40" width="1100" height="550" rx="10" fill="#050505"/>

  <g clip-path="url(#screen-clip)">

    <g>
      <animate attributeName="opacity" values="1;0.99;1;0.985;1" dur="0.2s" repeatCount="indefinite"/>

      <rect x="50" y="40" width="1100" height="550" fill="#66ff99" opacity="0">
        <animate attributeName="opacity" values="0;0.05;0" begin="0s" dur="0.5s" fill="freeze"/>
      </rect>

      <rect x="50" y="40" width="1100" height="550" fill="url(#screen-glow)"/>

      <!-- ============================== -->
      <!--        BOOT SEQUENCE           -->
      <!-- ============================== -->
      <g id="boot">

        <text x="80" y="78" font-family="'Courier New',Courier,monospace" font-size="22" fill="#66ff99" opacity="0" font-weight="bold" filter="url(#glow)">RMG TECHNICAL WORKSTATION
          <animate attributeName="opacity" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
        </text>
        <text x="80" y="96" font-family="'Courier New',Courier,monospace" font-size="12" fill="#2a3a2a" opacity="0">&#9484;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9488;
          <animate attributeName="opacity" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
        </text>

        <text x="80" y="126" font-family="'Courier New',Courier,monospace" font-size="15" fill="#66ff99" opacity="0" filter="url(#glow)">INITIALIZING RMG SYSTEM...
          <animate attributeName="opacity" to="1" begin="0.9s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- DOCUMENTATION MODULE -->
        <text x="80" y="158" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" opacity="0">LOADING DOCUMENTATION MODULE...
          <animate attributeName="opacity" to="1" begin="1.3s" dur="0.08s" fill="freeze"/>
        </text>

        <rect x="80" y="170" width="240" height="10" fill="#0a1a0a" rx="1" opacity="0">
          <animate attributeName="opacity" to="1" begin="1.3s" dur="0.08s" fill="freeze"/>
        </rect>
        <rect x="80" y="170" width="0" height="10" fill="#66ff99" rx="1" opacity="0.85">
          <animate attributeName="width" from="0" to="240" begin="1.4s" dur="0.5s" fill="freeze"/>
        </rect>
        <text x="330" y="180" font-family="'Courier New',Courier,monospace" font-size="12" fill="#66ff99" opacity="0">100%
          <animate attributeName="opacity" to="1" begin="1.9s" dur="0.08s" fill="freeze"/>
        </text>

        <text x="80" y="196" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Loading docs.conf
          <animate attributeName="opacity" to="1" begin="1.5s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="210" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Initializing doc. subsystem
          <animate attributeName="opacity" to="1" begin="1.8s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- AUTOMATION MODULE -->
        <text x="80" y="232" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" opacity="0">LOADING AUTOMATION MODULE...
          <animate attributeName="opacity" to="1" begin="2.1s" dur="0.08s" fill="freeze"/>
        </text>

        <rect x="80" y="244" width="240" height="10" fill="#0a1a0a" rx="1" opacity="0">
          <animate attributeName="opacity" to="1" begin="2.1s" dur="0.08s" fill="freeze"/>
        </rect>
        <rect x="80" y="244" width="0" height="10" fill="#66ff99" rx="1" opacity="0.85">
          <animate attributeName="width" from="0" to="240" begin="2.2s" dur="0.5s" fill="freeze"/>
        </rect>
        <text x="330" y="254" font-family="'Courier New',Courier,monospace" font-size="12" fill="#66ff99" opacity="0">100%
          <animate attributeName="opacity" to="1" begin="2.7s" dur="0.08s" fill="freeze"/>
        </text>

        <text x="80" y="270" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Loading automation.conf
          <animate attributeName="opacity" to="1" begin="2.3s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="284" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Initializing automations
          <animate attributeName="opacity" to="1" begin="2.6s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- OPEN SOURCE MODULE -->
        <text x="80" y="306" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" opacity="0">LOADING OPEN SOURCE MODULE...
          <animate attributeName="opacity" to="1" begin="2.9s" dur="0.08s" fill="freeze"/>
        </text>

        <rect x="80" y="318" width="240" height="10" fill="#0a1a0a" rx="1" opacity="0">
          <animate attributeName="opacity" to="1" begin="2.9s" dur="0.08s" fill="freeze"/>
        </rect>
        <rect x="80" y="318" width="0" height="10" fill="#66ff99" rx="1" opacity="0.85">
          <animate attributeName="width" from="0" to="240" begin="3.0s" dur="0.5s" fill="freeze"/>
        </rect>
        <text x="330" y="328" font-family="'Courier New',Courier,monospace" font-size="12" fill="#66ff99" opacity="0">100%
          <animate attributeName="opacity" to="1" begin="3.5s" dur="0.08s" fill="freeze"/>
        </text>

        <text x="80" y="344" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Loading opensource.conf
          <animate attributeName="opacity" to="1" begin="3.1s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="358" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Syncing repository index
          <animate attributeName="opacity" to="1" begin="3.4s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- AI TOOLS -->
        <text x="80" y="380" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" opacity="0">LOADING AI TOOLS...
          <animate attributeName="opacity" to="1" begin="3.7s" dur="0.08s" fill="freeze"/>
        </text>

        <rect x="80" y="392" width="240" height="10" fill="#0a1a0a" rx="1" opacity="0">
          <animate attributeName="opacity" to="1" begin="3.7s" dur="0.08s" fill="freeze"/>
        </rect>
        <rect x="80" y="392" width="0" height="10" fill="#66ff99" rx="1" opacity="0.85">
          <animate attributeName="width" from="0" to="240" begin="3.8s" dur="0.5s" fill="freeze"/>
        </rect>
        <text x="330" y="402" font-family="'Courier New',Courier,monospace" font-size="12" fill="#66ff99" opacity="0">100%
          <animate attributeName="opacity" to="1" begin="4.3s" dur="0.08s" fill="freeze"/>
        </text>

        <text x="80" y="418" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Loading ai.conf
          <animate attributeName="opacity" to="1" begin="3.9s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="432" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4a7a5e" opacity="0">[  OK  ] Initializing AI integration
          <animate attributeName="opacity" to="1" begin="4.2s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- SYSTEM READY -->
        <text x="80" y="462" font-family="'Courier New',Courier,monospace" font-size="18" fill="#66ff99" opacity="0" font-weight="bold" filter="url(#glow)">SYSTEM READY
          <animate attributeName="opacity" to="1" begin="4.7s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- Boot prompt -->
        <text x="80" y="492" font-family="'Courier New',Courier,monospace" font-size="16" fill="#66ff99" opacity="0">&gt; 
          <animate attributeName="opacity" to="1" begin="5.1s" dur="0.05s" fill="freeze"/>
        </text>
        <rect x="98" y="480" width="9" height="16" fill="#66ff99" opacity="0">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="5.1s"/>
          <animate attributeName="opacity" to="0" begin="5.5s" dur="0.3s" fill="freeze"/>
        </rect>

        <animate attributeName="opacity" values="1;1;0" begin="5.6s" dur="0.3s" fill="freeze"/>
      </g>

      <!-- ============================== -->
      <!--        MAIN SCREEN             -->
      <!-- ============================== -->
      <g id="status" opacity="0">
        <animate attributeName="opacity" to="1" begin="5.9s" dur="0.3s" fill="freeze"/>

        <text x="80" y="78" font-family="'Courier New',Courier,monospace" font-size="24" fill="#66ff99" font-weight="bold" filter="url(#glow)">RMG TECHNICAL WORKSTATION</text>

        <text x="80" y="96" font-family="'Courier New',Courier,monospace" font-size="12" fill="#2a3a2a">&#9484;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9488;</text>

        <text x="100" y="128" font-family="'Courier New',Courier,monospace" font-size="18" fill="#55ffee">STATUS</text>
        <text x="320" y="128" font-family="'Courier New',Courier,monospace" font-size="18" fill="#66ff99" filter="url(#glow)">ONLINE</text>

        <text x="100" y="158" font-family="'Courier New',Courier,monospace" font-size="18" fill="#55ffee">ROLE</text>
        <text x="320" y="158" font-family="'Courier New',Courier,monospace" font-size="18" fill="#66ff99" filter="url(#glow)">IT TECHNICIAN</text>

        <text x="100" y="188" font-family="'Courier New',Courier,monospace" font-size="18" fill="#55ffee">EXPERIENCE</text>
        <text x="320" y="188" font-family="'Courier New',Courier,monospace" font-size="18" fill="#66ff99" filter="url(#glow)">16+ YEARS</text>

        <text x="80" y="215" font-family="'Courier New',Courier,monospace" font-size="12" fill="#2a3a2a">&#9500;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9508;</text>

        <text x="100" y="242" font-family="'Courier New',Courier,monospace" font-size="18" fill="#ffe066" font-weight="bold">CURRENT FOCUS</text>

        <text x="120" y="268" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99">AUTOMATION</text>
        <text x="320" y="268" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99">DOCUMENTATION</text>
        <text x="120" y="290" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99">OPEN SOURCE</text>
        <text x="320" y="290" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99">AI TOOLS</text>

        <text x="80" y="314" font-family="'Courier New',Courier,monospace" font-size="12" fill="#2a3a2a">&#9500;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9508;</text>

        <text x="100" y="341" font-family="'Courier New',Courier,monospace" font-size="18" fill="#ffe066" font-weight="bold">ACTIVE PROJECTS</text>

        <text x="120" y="368" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99">CV PARA TODOS</text>
        <text x="320" y="368" font-family="'Courier New',Courier,monospace" font-size="13" fill="#4a7a5e">&#9474; Content Creator</text>

        <text x="120" y="390" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99">MRFIX</text>

        <text x="80" y="414" font-family="'Courier New',Courier,monospace" font-size="12" fill="#2a3a2a">&#9492;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9496;</text>

