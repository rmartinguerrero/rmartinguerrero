<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="1200" height="4">
      <rect width="1200" height="2" fill="transparent"/>
      <rect y="2" width="1200" height="2" fill="#000" opacity="0.1"/>
    </pattern>
    <radialGradient id="curvature" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66ff99" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="screen-clip">
      <rect x="50" y="40" width="1100" height="550" rx="10"/>
    </clipPath>
    <linearGradient id="bezel-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- ===== MONITOR BEZEL ===== -->
  <rect width="1200" height="630" rx="22" fill="#1a1a1a"/>
  <rect x="2" y="2" width="1196" height="626" rx="20" fill="#151515"/>
  <rect x="7" y="7" width="1186" height="616" rx="18" fill="url(#bezel-edge)"/>
  <rect x="38" y="28" width="1124" height="574" rx="14" fill="#0a0a0a"/>
  <rect x="42" y="32" width="1116" height="566" rx="12" fill="#070707"/>

  <!-- ===== SCREEN ===== -->
  <rect x="50" y="40" width="1100" height="550" rx="10" fill="#050505"/>

  <!-- Screen content group -->
  <g clip-path="url(#screen-clip)">

    <!-- Very subtle phosphor flicker on content -->
    <g>
      <animate attributeName="opacity" values="1;0.99;1;0.985;1" dur="0.2s" repeatCount="indefinite"/>

      <!-- Power-on flash -->
      <rect x="50" y="40" width="1100" height="550" fill="#66ff99" opacity="0">
        <animate attributeName="opacity" values="0;0.05;0" begin="0s" dur="0.5s" fill="freeze"/>
      </rect>

      <!-- Ambient screen glow -->
      <rect x="50" y="40" width="1100" height="550" fill="url(#screen-glow)"/>

      <!-- ============================== -->
      <!--        BOOT SEQUENCE           -->
      <!-- ============================== -->
      <g id="boot">

        <!-- Boot header -->
        <text x="80" y="78" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" opacity="0" filter="url(#glow)">RMG TERMINAL v2.0 &#8212; BIOS v3.14</text>
        <text x="80" y="98" font-family="'Courier New',Courier,monospace" font-size="11" fill="#3d6b4e" opacity="0">Copyright (c) 2024 RMG Systems. All rights reserved.</text>
        <text x="80" y="118" font-family="'Courier New',Courier,monospace" font-size="11" fill="#3d6b4e" opacity="0">&#9484;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9488;</text>

        <!-- Animate boot header in -->
        <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.1s" fill="freeze"/>

        <!-- Boot lines - each appears with a delay -->
        <text x="80" y="144" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" opacity="0" filter="url(#glow)">
          [  OK  ] Initializing hardware interfaces...
          <animate attributeName="opacity" to="1" begin="1.1s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="166" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" opacity="0" filter="url(#glow)">
          [  OK  ] Loading kernel modules...
          <animate attributeName="opacity" to="1" begin="1.8s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="188" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" opacity="0" filter="url(#glow)">
          [  OK  ] Loading system architecture...
          <animate attributeName="opacity" to="1" begin="2.5s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="210" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" opacity="0" filter="url(#glow)">
          [  OK  ] Loading documentation engine...
          <animate attributeName="opacity" to="1" begin="3.2s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="232" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" opacity="0" filter="url(#glow)">
          [  OK  ] Loading repository index...
          <animate attributeName="opacity" to="1" begin="3.9s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="254" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" opacity="0" filter="url(#glow)">
          [  OK  ] Loading automation scripts...
          <animate attributeName="opacity" to="1" begin="4.6s" dur="0.08s" fill="freeze"/>
        </text>
        <text x="80" y="276" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" opacity="0" filter="url(#glow)">
          [  OK  ] Loading AI modules...
          <animate attributeName="opacity" to="1" begin="5.3s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- Separator after boot lines -->
        <text x="80" y="300" font-family="'Courier New',Courier,monospace" font-size="11" fill="#3d6b4e" opacity="0">&#9492;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9496;</text>
        <animate attributeName="opacity" to="1" begin="5.3s" dur="0.08s" fill="freeze"/>

        <!-- System ready -->
        <text x="80" y="330" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" opacity="0" font-weight="bold" filter="url(#glow)">
          System ready.
          <animate attributeName="opacity" to="1" begin="5.8s" dur="0.08s" fill="freeze"/>
        </text>

        <!-- Boot prompt with brief blink -->
        <text x="80" y="365" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" opacity="0">&gt; <animate attributeName="opacity" to="1" begin="6.1s" dur="0.05s" fill="freeze"/></text>
        <rect x="96" y="353" width="8" height="14" fill="#66ff99" opacity="0">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="6.1s"/>
          <animate attributeName="opacity" to="0" begin="6.5s" dur="0.3s" fill="freeze"/>
        </rect>

        <!-- Fade out entire boot sequence -->
        <animate attributeName="opacity" values="1;1;0" begin="6.6s" dur="0.3s" fill="freeze"/>
      </g>

      <!-- ============================== -->
      <!--        STATUS DISPLAY          -->
      <!-- ============================== -->
      <g id="status" opacity="0">
        <animate attributeName="opacity" to="1" begin="6.9s" dur="0.3s" fill="freeze"/>

        <!-- Title -->
        <text x="80" y="78" font-family="'Courier New',Courier,monospace" font-size="16" fill="#66ff99" font-weight="bold" filter="url(#glow)">RMG TERMINAL v2</text>

        <!-- Top border -->
        <text x="80" y="96" font-family="'Courier New',Courier,monospace" font-size="11" fill="#2a3a2a">&#9484;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9488;</text>

        <!-- STATUS -->
        <text x="100" y="124" font-family="'Courier New',Courier,monospace" font-size="14" fill="#55ffee">STATUS</text>
        <text x="260" y="124" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" filter="url(#glow)">ONLINE</text>

        <!-- ROLE -->
        <text x="100" y="149" font-family="'Courier New',Courier,monospace" font-size="14" fill="#55ffee">ROLE</text>
        <text x="260" y="149" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" filter="url(#glow)">IT Technician</text>

        <!-- MISSION -->
        <text x="100" y="174" font-family="'Courier New',Courier,monospace" font-size="14" fill="#55ffee">MISSION</text>
        <text x="260" y="174" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" filter="url(#glow)">Making technology simpler.</text>

        <!-- LOCATION -->
        <text x="100" y="199" font-family="'Courier New',Courier,monospace" font-size="14" fill="#55ffee">LOCATION</text>
        <text x="260" y="199" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" filter="url(#glow)">Italy</text>

        <!-- EXPERIENCE -->
        <text x="100" y="224" font-family="'Courier New',Courier,monospace" font-size="14" fill="#55ffee">EXPERIENCE</text>
        <text x="260" y="224" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" filter="url(#glow)">16+ years</text>

        <!-- Separator -->
        <text x="80" y="246" font-family="'Courier New',Courier,monospace" font-size="11" fill="#2a3a2a">&#9500;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9508;</text>

        <!-- ACTIVE PROJECTS -->
        <text x="100" y="272" font-family="'Courier New',Courier,monospace" font-size="13" fill="#ffe066" font-weight="bold">ACTIVE PROJECTS</text>

        <text x="120" y="297" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99">CV Para Todos</text>
        <text x="380" y="297" font-family="'Courier New',Courier,monospace" font-size="13" fill="#4a7a5e">&#9474; Content Creator</text>

        <text x="120" y="319" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99">Nostaltum</text>
        <text x="380" y="319" font-family="'Courier New',Courier,monospace" font-size="13" fill="#4a7a5e">&#9474; Website</text>

        <!-- Separator -->
        <text x="80" y="343" font-family="'Courier New',Courier,monospace" font-size="11" fill="#2a3a2a">&#9500;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9508;</text>

        <!-- SPECIALITIES -->
        <text x="100" y="369" font-family="'Courier New',Courier,monospace" font-size="13" fill="#ffe066" font-weight="bold">SPECIALITIES</text>

        <text x="120" y="394" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99">Automation    Architecture    Documentation</text>
        <text x="120" y="416" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99">WordPress     Astro           Linux</text>
        <text x="120" y="438" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99">GitHub        Open Source     AI</text>

        <!-- Separator -->
        <text x="80" y="462" font-family="'Courier New',Courier,monospace" font-size="11" fill="#2a3a2a">&#9500;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9508;</text>

        <!-- CURRENT STATUS -->
        <text x="100" y="490" font-family="'Courier New',Courier,monospace" font-size="14" fill="#55ffee">CURRENT STATUS</text>
        <text x="100" y="515" font-family="'Courier New',Courier,monospace" font-size="13" fill="#66ff99" filter="url(#glow)">Building useful tools.</text>

        <!-- Bottom border -->
        <text x="80" y="540" font-family="'Courier New',Courier,monospace" font-size="11" fill="#2a3a2a">&#9492;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9496;</text>

        <!-- Final prompt with blinking cursor -->
        <text x="80" y="568" font-family="'Courier New',Courier,monospace" font-size="14" fill="#66ff99" filter="url(#glow)">&gt; </text>
        <rect x="96" y="556" width="8" height="14" fill="#66ff99">
          <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>

    </g><!-- End flicker group -->

    <!-- Curvature vignette overlay -->
    <rect x="50" y="40" width="1100" height="550" fill="url(#curvature)"/>

    <!-- Scanlines overlay -->
    <rect x="50" y="40" width="1100" height="550" fill="url(#scanlines)"/>

    <!-- Moving refresh line (very subtle) -->
    <rect x="50" width="1100" height="1" fill="#66ff99" opacity="0">
      <animate attributeName="y" values="40;590" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.015;0.015;0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Subtle glass reflection -->
    <ellipse cx="320" cy="160" rx="280" ry="140" fill="#fff" opacity="0.004"/>
    <ellipse cx="900" cy="480" rx="180" ry="80" fill="#fff" opacity="0.002"/>
  </g>

  <!-- ===== POWER LED ===== -->
  <circle cx="66" cy="604" r="3.5" fill="#66ff99" opacity="0.85" filter="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.45;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="608" font-family="'Courier New',Courier,monospace" font-size="7" fill="#333" letter-spacing="1">PWR</text>
</svg>