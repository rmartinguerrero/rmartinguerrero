    <rect x="50" y="40" width="1100" height="550" fill="url(#curvature)"/>
    <rect x="50" y="40" width="1100" height="550" fill="url(#scanlines)"/>

    <rect x="50" width="1100" height="1" fill="#66ff99" opacity="0">
      <animate attributeName="y" values="40;590" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.015;0.015;0" dur="8s" repeatCount="indefinite"/>
